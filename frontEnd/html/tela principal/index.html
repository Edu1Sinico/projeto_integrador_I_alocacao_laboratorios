<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Alocação</title>
  <link rel="icon" type="image/png" href="../img/icon_E.png">
  <link rel="stylesheet" href="index_style.css"> <!-- CCS da pagina -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
    rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
    rel="stylesheet">
  <script src="../JS/Customheader.js" defer></script>
  <script src="../JS/Customfooter.js" defer></script>
</head>

<body>
  <custom-header></custom-header>
  <main>
    <form>
      <div>
        <div id="inputs-counteiner">
          <div id="search-box">
            <input type="text" placeholder="Pesquise o laboratório que deseja alocar">
            <div class="search-img"><img src="../img/search.png" alt="search"></div>
          </div>
          <div id="linha-search"></div>

          <div id="date-time">
            <div class="input-box">
              <input type="date">
              <div class="search-img"><img src="../img/calendar.png" alt="date"></div>
            </div>
            <div class="input-box">
              <input id="" type="time">
              <div class="search-img"><img src="../img/time.png" alt="time"></div>
            </div>
          </div>
        </div>
        <div class="container-filtros">
          <figure class="box-filtro-icone">
            <img class="icone-filtro" src="../img/filtro.png" alt="filtro">
          </figure>

          <div class="controles-filtros">
            <div class="grupo-campo">
              <label for="select-bloco">Bloco</label>
              <select id="select-bloco" name="bloco">
                <option value="" disabled selected hidden>Selecione...</option>
                <option value="A">Bloco A</option>
                <option value="B">Bloco B</option>
                <option value="C">Bloco C</option>
                <option value="D">Bloco D</option>
              </select>
            </div>

            <div class="grupo-campo">
              <label for="select-status">Status</label>
              <select id="select-status" name="status">
                <option value="" disabled selected hidden>Selecione...</option>
                <option value="disponivel">Disponível</option>
                <option value="indisponivel">Indisponível</option>
                <option value="pendente">Pendente</option>
              </select>
            </div>

            <div class="grupo-campo">
              <label for="input-computadores">Qtd. Computadores</label>
              <input type="number" id="input-computadores" name="computadores" min="0" placeholder="Ex: 20">
            </div>
          </div>
        </div>
      </div>
    </form>

    <h3>Aloque um laboratório</h3>
    <section>
      <div class="cards-grid">

        <!-- CARD 1 -->
        <div class="lab-card disponivel">
          <div class="topo-card">
            <h2>LAB 01</h2>
            <p>indisponivel</p>
          </div>

          <div class="info-card">
            <h1>Bloco D</h1>
            <p>50 Máquinas</p>
            <p></p>
          </div>

          <button class="trigger-btn-card">Mais</button>
        </div>

        <!-- CARD 2 -->
      <div class="lab-card indisponivel">
        <div class="topo-card">
          <h2>LAB 02</h2>
            <p>disponivel</p>
            </p>
        </div>

          <div class="info-card">
            <h1>Bloco D</h1>
          </div>

          <button class="trigger-btn-card">Mais</button>
        </div>

        <!-- CARD 3 -->
        <div class="lab-card pendente">
          <div class="topo-card">
            <h2>LAB 03</h2>
            <p>indisponivel</p>
          </div>

          <div class="info-card">
            <h1>Bloco D</h1>
          </div>

          <button class="trigger-btn-card">Mais</button>
        </div>

        <!-- CARD 4 -->
        <div class="lab-card disponivel">
          <div class="topo-card">
            <h2>LAB 04</h2>
          </div>

          <div class="info-card">
            <h1>Bloco D</h1>
          </div>

          <button class="trigger-btn-card">Mais</button>
        </div>

        <!-- CARD 5 -->
        <div class="lab-card indisponivel">
          <div class="topo-card">
            <h2>LAB 05</h2>
          </div>

          <div class="info-card">
            <h1>Bloco D</h1>
          </div>

          <button class="trigger-btn-card">Mais</button>
        </div>

        <!-- CARD 6 -->
        <div class="lab-card disponivel">
          <div class="topo-card">
            <h2>LAB 06</h2>
          </div>

          <div class="info-card">
            <h1>Bloco D</h1>
          </div>

          <button class="trigger-btn-card">Mais</button>
        </div>

        <!-- CARD 7 -->
        <div class="lab-card indisponivel">
          <div class="topo-card">
            <h2>LAB 07</h2>
          </div>

          <div class="info-card">
            <h1>Bloco D</h1>
          </div>

          <button class="trigger-btn-card">Mais</button>
        </div>

        <!-- CARD 8 -->
        <div class="lab-card pendente">
          <div class="topo-card">
            <h2>LAB 08</h2>
          </div>

          <div class="info-card">
            <h1>Bloco D</h1>
          </div>

          <button class="trigger-btn-card">Mais</button>
        </div>

        <!-- CARD 9 -->
        <div class="lab-card disponivel">
          <div class="topo-card">
            <h2>LAB 09</h2>
          </div>

          <div class="info-card">
            <h1>Bloco D</h1>
          </div>

          <button class="trigger-btn-card">Mais</button>
        </div>

        <!-- CARD 10 -->
        <div class="lab-card indisponivel">
          <div class="topo-card">
            <h2>LAB 10</h2>
          </div>

          <div class="info-card">
            <h1>Bloco D</h1>
          </div>

          <button class="trigger-btn-card">Mais</button>
        </div>

      </div>
    </section>
  </main>
  <custom-footer></custom-footer>
  <script>src = "../JS/Cards.js"</script>
</body>

</html>
