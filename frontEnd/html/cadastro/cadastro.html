<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="icon" type="image/png" href="../img/icon_E.png"> <!-- Icone da pagina -->
    <link rel="stylesheet" href="cadastro_style.css"> <!-- CCS da pagina -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"> <!--  Ln 9 a 12 - importa fonte Poppins-->
</head>
<body>
    <main class="painel">
        <figure class="logo-container">
            <img src="../img/Logotipo_E.png" alt="Logotipo Einstein Limeira" class="logo">
        </figure>
        
        <h1 id="titulo_portal">Portal de alocação</h1>

        <form id="infos">
            <div class="input-group">
                <div class="icon-box"><img class="icon-size" src="../img/list.png" alt="lista"></div>
                <select id="tipo_funcionario" name="usuario">
                    <option value="" disabled selected>Selecione o usuário</option>
                    <option value="cd">Coordenador</option>
                    <option value="dt">Diretor</option>
                    <option value="ti">Técnico TI</option>
                </select>
            </div>

            <div class="input-group">
                <div class="icon-box"><img class="icon-size" src="../img/user.png" alt="lista"></i></div>
                <input type="text" name="nome" id="cad_nome" placeholder="RF institucional">
            </div>

            <div class="input-group">
                <div class="icon-box"><img class="icon-size"src="../img/password.png" alt="lista"></div>
                <input type="password" name="senha" id="cad_senha" placeholder="Senha">
            </div>
        </form>

        <div class="links-footer">
            <a href="index.html" class="btn-enviar">Enviar</a>
        </div>
    </main>  
</body>
</html>
